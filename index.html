"現在有什麼干擾？", "action": "移開一項干擾，專注五分鐘。", "lines": ["當心走得太遠，", "不必責怪它，", "只要溫柔地把它帶回此刻。"]}, {"id": 17, "category": "潮汐｜情緒管理", "color": "#91ADBF", "situation": "當我忍不住拖延時", "quote": "有時候，你逃避的不是事情本身，而是開始之後可能遇見的感受。", "question": "開始這件事最困難的部分是什麼？", "action": "只完成第一個小步驟。", "lines": ["有時候，", "你逃避的不是事情本身，", "而是開始之後", "可能遇見的感受。"]}, {"id": 18, "category": "潮汐｜情緒管理", "color": "#91ADBF", "situation": "當我對自己失望時", "quote": "失望說明你曾經有所期待，卻不代表你不值得再次期待。", "question": "你原本期待什麼？", "action": "寫下一個可調整的做法。", "lines": ["失望說明你曾經有所期待，", "卻不代表你", "不值得再次期待。"]}, {"id": 19, "category": "潮汐｜情緒管理", "color": "#91ADBF", "situation": "當我想要放棄時", "quote": "休息、轉彎與停止，都可以是經過思考的選擇，不必一律稱為失敗。", "question": "你需要的是休息還是換方向？", "action": "找可信任的人討論下一步。", "lines": ["休息、轉彎與停止，", "都可以是經過思考的選擇，", "不必一律稱為失敗。"]}, {"id": 20, "category": "潮汐｜情緒管理", "color": "#91ADBF", "situation": "當我無法停止胡思亂想時", "quote": "不是每一個浮現的念頭，都需要你相信；也不是每一個問題，都需要此刻回答。", "question": "哪個想法最需要查證？", "action": "寫下想法與支持它的證據。", "lines": ["不是每一個浮現的念頭，", "都需要你相信；", "也不是每一個問題，", "都需要此刻回答。"]}, {"id": 21, "category": "日光｜社會覺察", "color": "#D8BA80", "situation": "當我被別人誤解時", "quote": "你可以努力讓別人理解你，也可以接受有些人暫時無法讀懂你。", "question": "對方可能缺少什麼資訊？", "action": "準備一句不指責的澄清。", "lines": ["你可以努力讓別人理解你，", "也可以接受有些人", "暫時無法讀懂你。"]}, {"id": 22, "category": "日光｜社會覺察", "color": "#D8BA80", "situation": "當我無法理解別人時", "quote": "同理不是走進別人的世界後，放棄自己的世界，而是知道世界不只有一種樣子。", "question": "對方可能重視什麼？", "action": "提出一個真誠的詢問。", "lines": ["同理不是走進別人的世界後，", "放棄自己的世界，", "而是知道", "世界不只有一種樣子。"]}, {"id": 23, "category": "日光｜社會覺察", "color": "#D8BA80", "situation": "當我看見同學被排擠時", "quote": "你不必成為拯救所有人的英雄，一個安全而真誠的善意，就可能讓孤單少一些。", "question": "怎麼做能降低對方的孤立感？", "action": "在安全情況下關心對方或告知老師。", "lines": ["你不必成為拯救所有人的英雄，", "一個安全而真誠的善意，", "就可能讓孤單少一些。"]}, {"id": 24, "category": "日光｜社會覺察", "color": "#D8BA80", "situation": "當我與他人意見不同時", "quote": "我們不必站在同一個位置，才能以尊重的方式看向彼此。", "question": "你們有沒有共同在意的事？", "action": "先重述對方觀點，再說自己的看法。", "lines": ["我們不必站在同一個位置，", "才能以尊重的方式", "看向彼此。"]}, {"id": 25, "category": "日光｜社會覺察", "color": "#D8BA80"
