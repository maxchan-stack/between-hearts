</style></head><body><div class="flow" aria-hidden="true"><i></i><i></i></div><main><header><h1>心之間</h1><small>BETWEEN HEARTS · 60張SEL情境牌卡</small></header><section id="intro"><div class="intro-copy"><div class="star">✧</div><h2>閉上眼睛</h2><p>在心中，靜靜面對你的問題。<br>帶著虔誠與真心，與自己相遇。</p></div><div class="label">選擇此刻想探索的面向</div><div class="topics" role="group" aria-label="抽卡面向"><button class="topic" data-topic="萌芽｜自我覺察" aria-pressed="false"><i style="background:#91A99A"></i><span><b>自我覺察</b><small>萌芽</small></span></button><button class="topic" data-topic="潮汐｜情緒管理" aria-pressed="false"><i style="background:#91ADBF"></i><span><b>情緒管理</b><small>潮汐</small></span></button><button class="topic" data-topic="日光｜社會覺察" aria-pressed="false"><i style="background:#D8BA80"></i><span><b>社會覺察</b><small>日光</small></span></button><button class="topic" data-topic="花語｜人際關係" aria-pressed="false"><i style="background:#C79C9C"></i><span><b>人際關係</b><small>花語</small></span></button><button class="topic" data-topic="岔路｜選擇與責任" aria-pressed="false"><i style="background:#ACA2C5"></i><span><b>選擇與責任</b><small>岔路</small></span></button><button class="topic" data-topic="山丘｜挫折與成長" aria-pressed="false"><i style="background:#B5BA8C"></i><span><b>挫折與成長</b><small>山丘</small></span></button><button class="all" data-topic="" aria-pressed="true">全部面向 · 60張</button></div><button class="primary" id="start">虔誠抽卡</button><small class="hint">當你準備好了，再出發。</small></section><section id="choose" hidden><div><h2>相信此刻的直覺</h2><p>選擇一張吸引你的牌卡</p><p id="chosen"></p></div><div class="fan" id="fan"></div><small class="hint">不必急著決定，依循此刻的感受。</small><button class="secondary" id="home">‹ 返回首頁</button></section><section id="result" hidden><article class="paper" id="paper" tabindex="0" role="button" aria-label="翻面"></article><button class="close" id="close" aria-label="返回首頁">×</button><div class="controls"><button id="flip">輕觸翻面 ↻</button><button class="again" id="again">再次抽卡</button></div></section></main><script>const data=[{"id": 1, "category": "萌芽｜自我覺察", "color": "#91A99A", "situation": "當我覺得自己不夠好時", "quote": "你不必成為別人眼中優秀的樣子，才有資格喜歡自己。", "question": "你用什麼標準評價自己？", "action": "寫下一件自己做得不錯的小事。", "lines": ["你不必成為別人眼中", "優秀的樣子，", "才有資格喜歡自己。"]}, {"id": 2, "category": "萌芽｜自我覺察", "color": "#91A99A", "situation": "當我總是與別人比較時", "quote": "別人的花期，不是你必須開花的期限。", "question": "你真正想達成的是什麼？", "action": "記下一項自己的進步。", "lines": ["別人的花期，", "不是你必須", "開花的期限。"]}, {"id": 3, "category": "萌芽｜自我覺察", "color": "#91A99A", "situation": "當我不知道自己喜歡什麼時", "quote": "不必急著找到熱愛，有些喜歡，是在一次次嘗試中慢慢長出來的。", "question": "什麼事情曾讓你忘記時間？", "action": "安排十分鐘探索一件好奇的事。", "lines": ["不必急著找到熱愛，", "有些喜歡，", "是在一次次嘗試中", "慢慢長出來的。"]}, {"id": 4, "category": "萌芽｜自我覺察", "color": "#91A99A", "situation": "當我害怕別人的眼光時", "quote": "別人眼中的你，只是故事的一個版本，而你仍然握有自己的筆。", "question": "你最擔心誰的評價？", "action": "選一件安全的小事依自己的喜好做。", "lines": ["別人眼中的你，", "只是故事的一個版本，", "而你仍然握有自己的筆。"]}, {"id": 5, "category": "萌芽｜自我覺察", "color": "#91A99A", "situation": "當我習慣否定自己時", "quote": "試著用你安慰朋友的方式，和自己說一次話。", "question": "你會怎麼對遇到同樣事情的朋友說話？", "action": "把一句自責改寫成具體描述。", "lines": ["試著用你安慰朋友的方式，", "和自己說一次話。"]}, {"id": 6, "category": "萌芽｜自我覺察", "color": "#91A99A", "situation": "當我不知道為何難過時", "quote": "有些感受還來不及成為語言，也值得被好好安放。", "question": "今天有哪些事情可能影響你？", "action": "寫下此刻的身體感受與情緒。", "lines": ["有些感受", "還來不及成為語言，", "也值得被好好安放。"]}, {"id": 7, "category": "萌芽｜自我覺察", "color": "#91A99A", "situation": "當我覺得自己很普通時", "quote": "不必成為最耀眼的星星，才值得擁有自己的一片天空。", "question": "你珍惜自己哪些日常特質？", "action": "記下一個自己重視的特質。", "lines": ["不必成為最耀眼的星星，", "才值得擁有", "自己的一片天空。"]}, {"id": 8, "category": "萌芽｜自我覺察", "color": "#91A99A", "situation": "當我不敢展現真實自己時", "quote": "你可以慢慢卸下偽裝，不必在每個人面前證明自己的真實。", "question": "在哪裡你比較能自在做自己？", "action": "向可信任的人分享一個小喜好。", "lines": ["你可以慢慢卸下偽裝，", "不必在每個人面前", "證明自己的真實。"]}, {"id": 9, "category": "萌芽｜自我覺察", "color": "#91A99A", "situation": "當我覺得自己不被理解時", "quote": "暫時沒有人讀懂你，不代表你的故事不值得被閱讀。", "question": "你希望別人理解哪一部分？", "action": "試著用一句話描述自己的需求。", "lines": ["暫時沒有人讀懂你，", "不代表你的故事", "不值得被閱讀。"]}, {"id": 10, "category": "萌芽｜自我覺察", "color": "#91A99A", "situation": "當我不知道自己的價值時", "quote": "你的價值，不只是你完成了什麼，也在於你如何感受、選擇與生活。", "question": "什麼事情對你而言重要？", "action": "選出三個自己重視的價值。", "lines": ["你的價值，", "不只是你完成了什麼，", "也在於你如何感受、", "選擇與生活。"]}, {"id": 11, "category": "潮汐｜情緒管理", "color": "#91ADBF", "situation": "當我感到焦慮時", "quote": "不必為尚未發生的風雨，淋濕此刻的自己。", "question": "哪些是事實，哪些是你的預測？", "action": "列出一件現在能處理的事。", "lines": ["不必為尚未發生的風雨，", "淋濕此刻的自己。"]}, {"id": 12, "category": "潮汐｜情緒管理", "color": "#91ADBF", "situation": "當我生氣想要爆發時", "quote": "憤怒可以告訴你什麼很重要，卻不必替你決定下一步。", "question": "你想保護什麼？", "action": "先離開衝突現場，到安全處整理想法。", "lines": ["憤怒可以告訴你", "什麼很重要，", "卻不必替你決定下一步。"]}, {"id": 13, "category": "潮汐｜情緒管理", "color": "#91ADBF", "situation": "當我壓力太大時", "quote": "有時候，真正的堅強不是再多承受一點，而是承認自己需要少背一些。", "question": "哪些任務可以延後或求助？", "action": "把今天的任務分成必要與可延後。", "lines": ["有時候，", "真正的堅強不是再多承受一點，", "而是承認自己", "需要少背一些。"]}, {"id": 14, "category": "潮汐｜情緒管理", "color": "#91ADBF", "situation": "當我情緒突然低落時", "quote": "天空不必每天晴朗，你也不必每天都過得很好。", "question": "此刻你需要休息、陪伴還是空間？", "action": "選一項能照顧自己的小事。", "lines": ["天空不必每天晴朗，", "你也不必每天", "都過得很好。"]}, {"id": 15, "category": "潮汐｜情緒管理", "color": "#91ADBF", "situation": "當我害怕失敗時", "quote": "勇敢不是不再害怕，而是允許害怕的自己，仍有嘗試的可能。", "question": "最小且可承受的嘗試是什麼？", "action": "把任務縮小成五分鐘的第一步。", "lines": ["勇敢不是不再害怕，", "而是允許害怕的自己，", "仍有嘗試的可能。"]}, {"id": 16, "category": "潮汐｜情緒管理", "color": "#91ADBF", "situation": "當我無法專心時", "quote": "當心走得太遠，不必責怪它，只要溫柔地把它帶回此刻。", "question": "現在有什麼干擾？", "action": "移開一項干擾，專注五分鐘。", "lines": ["當心走得太遠，", "不必責怪它，", "只要溫柔地把它帶回此刻。"]}, {"id": 17, "category": "潮汐｜情緒管理", "color": "#91ADBF", "situation": "當我忍不住拖延時", "quote": "有時候，你逃避的不是事情本身，而是開始之後可能遇見的感受。", "question": "開始這件事最困難的部分是什麼？", "action": "只完成第一個小步驟。", "lines": ["有時候，", "你逃避的不是事情本身，", "而是開始之後", "可能遇見的感受。"]}, {"id": 18, "category": "潮汐｜情緒管理", "color": "#91ADBF", "situation": "當我對自己失望時", "quote": "失望說明你曾經有所期待，卻不代表你不值得再次期待。", "question": "你原本期待什麼？", "action": "寫下一個可調整的做法。", "lines": ["失望說明你曾經有所期待，", "卻不代表你", "不值得再次期待。"]}, {"id": 19, "category": "潮汐｜情緒管理", "color": "#91ADBF", "situation": "當我想要放棄時", "quote": "休息、轉彎與停止，都可以是經過思考的選擇，不必一律稱為失敗。", "question": "你需要的是休息還是換方向？", "action": "找可信任的人討論下一步。", "lines": ["休息、轉彎與停止，", "都可以是經過思考的選擇，", "不必一律稱為失敗。"]}, {"id": 20, "category": "潮汐｜情緒管理", "color": "#91ADBF", "situation": "當我無法停止胡思亂想時", "quote": "不是每一個浮現的念頭，都需要你相信；也不是每一個問題，都需要此刻回答。", "question": "哪個想法最需要查證？", "action": "寫下想法與支持它的證據。", "lines": ["不是每一個浮現的念頭，", "都需要你相信；", "也不是每一個問題，", "都需要此刻回答。"]}, {"id": 21, "category": "日光｜社會覺察", "color": "#D8BA80", "situation": "當我被別人誤解時", "quote": "你可以努力讓別人理解你，也可以接受有些人暫時無法讀懂你。", "question": "對方可能缺少什麼資訊？", "action": "準備一句不指責的澄清。", "lines": ["你可以努力讓別人理解你，", "也可以接受有些人", "暫時無法讀懂你。"]}, {"id": 22, "category": "日光｜社會覺察", "color": "#D8BA80", "situation": "當我無法理解別人時", "quote": "同理不是走進別人的世界後，放棄自己的世界，而是知道世界不只有一種樣子。", "question": "對方可能重視什麼？", "action": "提出一個真誠的詢問。", "lines": ["同理不是走進別人的世界後，", "放棄自己的世界，", "而是知道", "世界不只有一種樣子。"]}, {"id": 23, "category": "日光｜社會覺察", "color": "#D8BA80", "situation": "當我看見同學被排擠時", "quote": "你不必成為拯救所有人的英雄，一個安全而真誠的善意，就可能讓孤單少一些。", "question": "怎麼做能降低對方的孤立感？", "action": "在安全情況下關心對方或告知老師。", "lines": ["你不必成為拯救所有人的英雄，", "一個安全而真誠的善意，", "就可能讓孤單少一些。"]}, {"id": 24, "category": "日光｜社會覺察", "color": "#D8BA80", "situation": "當我與他人意見不同時", "quote": "我們不必站在同一個位置，才能以尊重的方式看向彼此。", "question": "你們有沒有共同在意的事？", "action": "先重述對方觀點，再說自己的看法。", "lines": ["我們不必站在同一個位置，", "才能以尊重的方式", "看向彼此。"]}, {"id": 25, "category": "日光｜社會覺察", "color": "#D8BA80", "situation": "當我忽略別人的感受時", "quote": "善意是出發的地方，而理解對方的感受，是讓善意真正抵達的方式。", "question": "你的行為可能造成什麼影響？", "action": "詢問對方的感受並聆聽。", "lines": ["善意是出發的地方，", "而理解對方的感受，", "是讓善意真正抵達的方式。"]}, {"id": 26, "category": "日光｜社會覺察", "color": "#D8BA80", "situation": "當我覺得別人不公平時", "quote": "給予每個人相同的東西，不一定能讓每個人擁有相同的機會。", "question": "你掌握了哪些資訊？", "action": "先確認規則，再提出疑問。", "lines": ["給予每個人相同的東西，", "不一定能讓每個人", "擁有相同的機會。"]}, {"id": 27, "category": "日光｜社會覺察", "color": "#D8BA80", "situation": "當我對別人產生嫉妒時", "quote": "嫉妒有時是一封來自內心的信，提醒你也有尚未被看見的渴望。", "question": "你羨慕的是什麼？", "action": "把羨慕轉成一個自己的目標。", "lines": ["嫉妒有時是一封來自內心的信，", "提醒你也有", "尚未被看見的渴望。"]}, {"id": 28, "category": "日光｜社會覺察", "color": "#D8BA80", "situation": "當我面對不同價值觀時", "quote": "尊重不是讓彼此變得相同，而是讓不同的我們仍有共存的空間。", "question": "哪些差異可以共存？", "action": "找出一項可以共同遵守的原則。", "lines": ["尊重不是讓彼此變得相同，", "而是讓不同的我們", "仍有共存的空間。"]}, {"id": 29, "category": "日光｜社會覺察", "color": "#D8BA80", "situation": "當我不知道如何安慰別人時", "quote": "有時候，一個人需要的不是答案，而是有人願意陪他待在沒有答案的地方。", "question": "對方想被聽見還是想要建議？", "action": "問對方希望你怎麼陪伴。", "lines": ["有時候，", "一個人需要的不是答案，", "而是有人願意陪他", "待在沒有答案的地方。"]}, {"id": 30, "category": "日光｜社會覺察", "color": "#D8BA80", "situation": "當我對他人產生偏見時", "quote": "別急著用你看見的一頁，替別人的整本人生寫下結論。", "question": "你有哪些尚未確認的假設？", "action": "找一項能補充觀點的資訊。", "lines": ["別急著用你看見的一頁，", "替別人的整本人生", "寫下結論。"]}, {"id": 31, "category": "花語｜人際關係", "color": "#C79C9C", "situation": "當我與朋友吵架時", "quote": "如果你珍惜這段關係，或許比起證明誰是對的，更值得思考的是如何讓彼此被聽見。", "question": "你希望對方理解什麼？", "action": "用我感到、我希望開頭表達。", "lines": ["如果你珍惜這段關係，", "或許比起證明誰是對的，", "更值得思考的是", "如何讓彼此被聽見。"]}, {"id": 32, "category": "花語｜人際關係", "color": "#C79C9C", "situation": "當我被朋友冷落時", "quote": "別急著用別人的沉默，替自己寫下一個不被喜歡的故事。", "question": "你知道什麼，又猜測了什麼？", "action": "在合適時機詢問對方近況。", "lines": ["別急著用別人的沉默，", "替自己寫下一個", "不被喜歡的故事。"]}, {"id": 33, "category": "花語｜人際關係", "color": "#C79C9C", "situation": "當我不敢拒絕別人時", "quote": "你的每一次勉強答應，都可能讓真正的自己少了一點說話的空間。", "question": "你擔心拒絕後發生什麼？", "action": "練習說：謝謝你，但我目前不方便。", "lines": ["你的每一次勉強答應，", "都可能讓真正的自己", "少了一點說話的空間。"]}, {"id": 34, "category": "花語｜人際關係", "color": "#C79C9C", "situation": "當我害怕失去朋友時", "quote": "值得珍惜的關係，不應只靠一個人小心翼翼地維持。", "question": "你希望友誼有哪些互相尊重？", "action": "說出一項自己重視的相處方式。", "lines": ["值得珍惜的關係，", "不應只靠一個人", "小心翼翼地維持。"]}, {"id": 35, "category": "花語｜人際關係", "color": "#C79C9C", "situation": "當我總是討好別人時", "quote": "你可以成為溫柔的人，但不必把所有的溫柔都留給別人。", "question": "你忽略了什麼需求？", "action": "答應前先確認自己的時間與意願。", "lines": ["你可以成為溫柔的人，", "但不必把所有的溫柔", "都留給別人。"]}, {"id": 36, "category": "花語｜人際關係", "color": "#C79C9C", "situation": "當我與父母發生衝突時", "quote": "愛與理解並不總是同時抵達，有些關係需要時間，也需要安全的距離。", "question": "你希望家人知道什麼？", "action": "選擇平靜時機或請可信任成人協助。", "lines": ["愛與理解並不總是同時抵達，", "有些關係需要時間，", "也需要安全的距離。"]}, {"id": 37, "category": "花語｜人際關係", "color": "#C79C9C", "situation": "當我不敢開口求助時", "quote": "不是所有的路都需要獨自走完，願意伸出手，也是照顧自己的能力。", "question": "誰可能提供合適的協助？", "action": "向一位可信任的人提出具體請求。", "lines": ["不是所有的路", "都需要獨自走完，", "願意伸出手，", "也是照顧自己的能力。"]}, {"id": 38, "category": "花語｜人際關係", "color": "#C79C9C", "situation": "當我覺得自己很孤單時", "quote": "此刻的孤單，不是你不值得被愛的證明，而是你渴望連結的聲音。", "question": "哪種陪伴會讓你比較自在？", "action": "向一位安全的人傳送問候。", "lines": ["此刻的孤單，", "不是你不值得被愛的證明，", "而是你渴望連結的聲音。"]}, {"id": 39, "category": "花語｜人際關係", "color": "#C79C9C", "situation": "當我想道歉卻說不出口時", "quote": "真誠的道歉，不是為了換取原諒，而是願意看見自己曾帶給別人的傷害。", "question": "你願意為哪個行為負責？", "action": "寫下一句具體且不找藉口的道歉。", "lines": ["真誠的道歉，", "不是為了換取原諒，", "而是願意看見自己", "曾帶給別人的傷害。"]}, {"id": 40, "category": "花語｜人際關係", "color": "#C79C9C", "situation": "當我不知道如何建立界線時", "quote": "界線不是拒絕別人靠近，而是讓靠近的人知道，如何尊重你的存在。", "question": "哪種行為讓你不舒服？", "action": "練習清楚說出一項界線。", "lines": ["界線不是拒絕別人靠近，", "而是讓靠近的人知道，", "如何尊重你的存在。"]}, {"id": 41, "category": "岔路｜選擇與責任", "color": "#ACA2C5", "situation": "當我面對兩難選擇時", "quote": "有些選擇沒有完美的答案，只有你願意珍惜什麼，又願意承擔什麼。", "question": "哪項價值對你最重要？", "action": "列出兩個選項的可能影響。", "lines": ["有些選擇沒有完美的答案，", "只有你願意珍惜什麼，", "又願意承擔什麼。"]}, {"id": 42, "category": "岔路｜選擇與責任", "color": "#ACA2C5", "situation": "當我害怕做錯決定時", "quote": "你無法要求每個選擇都有好的結果，但可以讓每個選擇都有認真思考的理由。", "question": "還需要哪些資訊？", "action": "找出一項可以查證的資訊。", "lines": ["你無法要求每個選擇", "都有好的結果，", "但可以讓每個選擇", "都有認真思考的理由。"]}, {"id": 43, "category": "岔路｜選擇與責任", "color": "#ACA2C5", "situation": "當我被同儕影響時", "quote": "真正的歸屬，不需要你先遺失自己，才能換得一個位置。", "question": "如果沒有人看著，你會怎麼選？", "action": "準備一句拒絕不安全邀約的話。", "lines": ["真正的歸屬，", "不需要你先遺失自己，", "才能換得一個位置。"]}, {"id": 44, "category": "岔路｜選擇與責任", "color": "#ACA2C5", "situation": "當我不想承擔責任時", "quote": "承認自己的錯誤，不是承認自己很糟，而是承認自己仍有改變的能力。", "question": "哪部分是你能負責的？", "action": "完成一項可以補救的行動。", "lines": ["承認自己的錯誤，", "不是承認自己很糟，", "而是承認自己", "仍有改變的能力。"]}, {"id": 45, "category": "岔路｜選擇與責任", "color": "#ACA2C5", "situation": "當我後悔自己的選擇時", "quote": "你無法回到昨天重新選擇，卻能帶著昨天的理解，走向不同的明天。", "question": "下次你想改變什麼？", "action": "寫下一條未來的決策提醒。", "lines": ["你無法回到昨天重新選擇，", "卻能帶著昨天的理解，", "走向不同的明天。"]}, {"id": 46, "category": "岔路｜選擇與責任", "color": "#ACA2C5", "situation": "當我面對誘惑時", "quote": "在做出選擇之前，試著問問未來的自己，是否也願意接受此刻的決定。", "question": "這個選擇明天會帶來什麼影響？", "action": "延後十分鐘再決定。", "lines": ["在做出選擇之前，", "試著問問未來的自己，", "是否也願意接受", "此刻的決定。"]}, {"id": 47, "category": "岔路｜選擇與責任", "color": "#ACA2C5", "situation": "當我不知道如何取捨時", "quote": "不是每一條值得走的路，你都必須走過。", "question": "你現在最需要保留什麼？", "action": "為選項排出優先順序。", "lines": ["不是每一條", "值得走的路，", "你都必須走過。"]}, {"id": 48, "category": "岔路｜選擇與責任", "color": "#ACA2C5", "situation": "當我害怕讓別人失望時", "quote": "你可以珍惜別人的期待，卻不必把自己的人生變成完成期待的任務。", "question": "哪些期待是你願意承擔的？", "action": "練習說明一項真實限制。", "lines": ["你可以珍惜別人的期待，", "卻不必把自己的人生", "變成完成期待的任務。"]}, {"id": 49, "category": "岔路｜選擇與責任", "color": "#ACA2C5", "situation": "當我面對不公平的事情時", "quote": "正義不只有勇敢發聲的模樣，也包括懂得保護自己、尋求支持與選擇有效的行動。", "question": "有哪些可信任的支持管道？", "action": "記錄事實並向合適成人求助。", "lines": ["正義不只有勇敢發聲的模樣，", "也包括懂得保護自己、", "尋求支持與選擇有效的行動。"]}, {"id": 50, "category": "岔路｜選擇與責任", "color": "#ACA2C5", "situation": "當我不知道下一步怎麼走時", "quote": "當你看不見整條路時，可以先尋找一個願意踏出的方向。", "question": "哪一步成本低且可以修正？", "action": "安排一項可逆的小嘗試。", "lines": ["當你看不見整條路時，", "可以先尋找", "一個願意踏出的方向。"]}, {"id": 51, "category": "山丘｜挫折與成長", "color": "#B5BA8C", "situation": "當我考試失利時", "quote": "一張考卷可以留下你的分數，卻寫不完你的價值。", "question": "錯誤透露哪些學習需求？", "action": "挑一題錯題找出原因。", "lines": ["一張考卷可以留下你的分數，", "卻寫不完你的價值。"]}, {"id": 52, "category": "山丘｜挫折與成長", "color": "#B5BA8C", "situation": "當我努力卻沒有成果時", "quote": "努力值得被看見，但沒有結果的時候，也值得重新思考方法，而不是一味責怪自己。", "question": "哪個環節可能需要調整？", "action": "請人回饋一項做法。", "lines": ["努力值得被看見，", "但沒有結果的時候，", "也值得重新思考方法，", "而不是一味責怪自己。"]}, {"id": 53, "category": "山丘｜挫折與成長", "color": "#B5BA8C", "situation": "當我對未來感到迷惘時", "quote": "有些方向，不是在出發前找到的，而是在走過的路上慢慢浮現。", "question": "你對什麼仍有好奇？", "action": "查詢一個感興趣的領域。",
